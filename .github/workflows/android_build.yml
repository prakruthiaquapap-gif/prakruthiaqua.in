name: Build Prakruthi Aqua APK
on:
  workflow_dispatch:
    inputs:
      website_url:
        description: Live HTTPS website opened by the app
        required: true
        default: https://prakruthiaqua.in/
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Build installable test APK
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.website_url }}
        run: npm run android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: Prakruthi-Aqua-APK
          path: output/android/Prakruthi-Aqua-debug.apk
          if-no-files-found: error
