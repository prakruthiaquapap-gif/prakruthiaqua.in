name: Build Prakruthi Aqua AAB
on:
  workflow_dispatch:
    inputs:
      website_url:
        description: Live HTTPS website opened by the app
        required: true
        default: https://prakruthiaqua.in/
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Restore private upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node -e 'const fs=require("node:fs"),path=require("node:path"); const key=process.env.ANDROID_KEYSTORE_BASE64; if(!key) throw new Error("Configure ANDROID_KEYSTORE_BASE64 in repository Actions secrets"); fs.writeFileSync(path.join(process.env.RUNNER_TEMP,"prakruthi-upload.keystore"),Buffer.from(key,"base64"),{mode:0o600});'
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/prakruthi-upload.keystore" >> "$GITHUB_ENV"
      - name: Build signed release AAB
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.website_url }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:aab
      - name: Record build identity
        env:
          STORE_URL: ${{ inputs.website_url }}
        run: |
          node -e 'const fs = require("node:fs"); fs.writeFileSync("output/android/build-info.json", JSON.stringify({ commit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_NUMBER, website: process.env.STORE_URL }, null, 2) + "\n");'
          cd output/android
          sha256sum Prakruthi-Aqua-release.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Prakruthi-Aqua-AAB-${{ github.run_number }}
          path: |
            output/android/Prakruthi-Aqua-release.aab
            output/android/build-info.json
            output/android/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
